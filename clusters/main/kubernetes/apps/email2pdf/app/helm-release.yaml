---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: email2pdf
  namespace: email2pdf
spec:
  interval: 15m
  chart:
    spec:
      chart: app-template
      version: 18.16.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 15m
  timeout: 20m
  maxHistory: 3
  driftDetection:
    mode: warn
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    global:
      stopAll: false    
    TZ: Europe/Brussels
    resources:
      requests:
        cpu: 10m
    image:
      repository: ghcr.io/rob-luke/emails-html-to-pdf
      pullPolicy: IfNotPresent
      tag: latest
    service:
      main:
        enabled: false
        ports:
          main:
            enabled: false
            protocol: http  
    workload:
      main:
        podSpec:
          containers:
            main:
              probes:
                liveness:
                  enabled: true
                  type: "{{ .Values.service.main.ports.main.protocol }}"
                  port: "{{ $.Values.service.main.ports.main.targetPort | default .Values.service.main.ports.main.port }}"
                readiness:
                  enabled: true
                  type: "{{ .Values.service.main.ports.main.protocol }}"
                  port: "{{ $.Values.service.main.ports.main.targetPort | default .Values.service.main.ports.main.port }}"
                startup:
                  enabled: true
                  type: "{{ .Values.service.main.ports.main.protocol }}"
                  port: "{{ $.Values.service.main.ports.main.targetPort | default .Values.service.main.ports.main.port }}"
              env:
                #- IMAP_URL: "imap.gmail.com"
                #- IMAP_USERNAME: ${GMAIL_USER}
                #- IMAP_PASSWORD: ${AUTHENTIK_SMTP_PWD}
                SMTP_USERNAME: ${GMAIL_USER}
                SMTP_PASSWORD: ${AUTHENTIK_SMTP_PWD}
                IMAP_FOLDER: "test"
                SMTP_URL: "smtp.google.com"
                MAIL_SENDER: ${GMAIL_USER}
                MAIL_DESTINATION: ${GMAIL_USER}
                INTER_RUN_INTERVAL: "600"
                #- HOSTS=127.0.0.1 tracking.paypal.com
                WKHTMLTOPDF_OPTIONS: "{\"load-media-error-handling\": \"ignore\"}"